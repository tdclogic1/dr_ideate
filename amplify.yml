version: 1
frontend:
  phases:
    preBuild:
      commands:
        # Amplify build image must be Amazon Linux 2023 for Node 22.
        - nvm install 22 && nvm use 22
        - node --version
        - npm ci
    build:
      commands:
        # Deploys the Convex functions, then builds the static site with VITE_CONVEX_URL set.
        # CONVEX_DEPLOY_KEY is the only Amplify environment variable needed.
        - npx convex deploy --cmd 'npm run build'
  artifacts:
    baseDirectory: dist
    files:
      - "**/*"
  cache:
    paths:
      - node_modules/**/*
